name: Deploy Heberjahiz

on:
  push:
    branches: [php-haja]
  workflow_dispatch:

concurrency:
  group: deploy-heberjahiz
  cancel-in-progress: true

jobs:
  deploy:
    name: Zip + extract vers app.centirio.ma
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Packager l'application
        run: |
          mkdir -p dist_pkg
          # Extracteur embarque dans le zip, token unique par run
          TOKEN="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed "s/__TOKEN__/$TOKEN/" .github/deploy/extract_template.php > _deploy_extract.php
          # Un seul transfert FTP au lieu de milliers de fichiers :
          # le serveur coupe les sessions TLS longues (err 553 / SSL alert 50)
          zip -qr dist_pkg/app.zip . \
            -x ".git/*" ".github/*" ".opencode/*" ".vscode/*" \
            -x "node_modules/*" "docs/*" "scripts/*" "tests/*" \
            -x "graphify-out/*" "database/exports/*" \
            -x "dist_pkg/*" \
            -x "*dossiers_generer*" "backups/*" \
            -x "*.md" "*.cmd" "*.ps1" "*.sh" "*.mjs" \
            -x "_debug*.php"

      - name: Upload du paquet via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --ssl-reqd --connect-timeout 30 --max-time 900 \
            -T dist_pkg/app.zip \
            "ftp://$FTP_HOST/app.centirio.ma/app.zip" \
            --user "$FTP_USER:$FTP_PASSWORD"

      - name: Extraction sur le serveur
        run: |
          TOKEN="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          OK=0
          for i in 1 2 3 4 5; do
            RESP=$(curl -sk --max-time 300 -X POST \
              -d "token=$TOKEN" \
              https://app.centirio.ma/_deploy_extract.php || true)
            echo "Tentative $i : $RESP"
            if [ "$RESP" = "EXTRACT_OK" ]; then OK=1; break; fi
            sleep 10
          done
          [ "$OK" = "1" ] || exit 1
