name: Deploy Heberjahiz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-heberjahiz
  cancel-in-progress: true

jobs:
  test:
    name: Tests unitaires (PHPUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: zip

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Lancer PHPUnit
        run: ./vendor/bin/phpunit --no-coverage

  deploy:
    name: Zip + extract vers app.centirio.ma
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Packager l'application
        run: |
          mkdir -p dist_pkg
          # Extracteur envoye A COTE du zip (sinon 404 : il ne peut s'executer
          # qu'apres la premiere extraction). Token unique par run.
          TOKEN="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed "s/__TOKEN__/$TOKEN/" .github/deploy/extract_template.php > dist_pkg/_deploy_extract.php
          # Un seul gros transfert FTP au lieu de milliers de fichiers :
          # le serveur coupe les sessions TLS longues (err 553 / SSL alert 50)
          zip -qr dist_pkg/app.zip . \
            -x ".git/*" ".github/*" ".opencode/*" ".vscode/*" \
            -x "node_modules/*" "docs/*" "scripts/*" "tests/*" \
            -x "graphify-out/*" "database/exports/*" \
            -x "dist_pkg/*" \
            -x "*dossiers_generer*" "backups/*" \
            -x "*.md" "*.cmd" "*.ps1" "*.sh" "*.mjs" \
            -x "_debug*.php"

      - name: Upload du paquet via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # -k : le certificat TLS du serveur FTP n'a pas le bon nom d'hote
          # (emis par Heberjahiz pour un autre nom) - chiffrement conserve
          UP=0
          for i in 1 2 3; do
            echo "Tentative $i..."
            # Le compte FTP almoudir@app.centirio.ma atterrit directement
            # dans le document root : /home/centiaxh/centirio.ma/app.centirio.ma
            if curl -k --ssl-reqd --connect-timeout 30 --max-time 900 \
                -T dist_pkg/app.zip \
                "ftp://$FTP_HOST/app.zip" \
                --user "$FTP_USER:$FTP_PASSWORD" \
            && curl -k --ssl-reqd --connect-timeout 30 \
                -T dist_pkg/_deploy_extract.php \
                "ftp://$FTP_HOST/_deploy_extract.php" \
                --user "$FTP_USER:$FTP_PASSWORD"; then
              UP=1; break
            fi
            sleep 10
          done
          [ "$UP" = "1" ] || exit 1

      - name: Attente de la stabilite du zip cote serveur
        run: |
          # Le curl FTPS retourne 0 avant que l'ecriture soit terminee
          # physiquement cote hebergeur : une extraction lancee trop tot lit
          # un zip tronque (EXTRACT_FAIL_OPEN) et fait echouer tout le run.
          LOCAL_SIZE=$(stat -c%s dist_pkg/app.zip)
          echo "Taille locale du zip : $LOCAL_SIZE octets"
          REMOTE_SIZE=0
          for i in $(seq 1 24); do
            REMOTE_SIZE=$(curl -sk -I --max-time 60 https://app.centirio.ma/app.zip \
              | grep -i '^content-length:' | tail -1 | tr -dc '0-9')
            echo "  tentative $i : distant=${REMOTE_SIZE:-inconnu} octets"
            if [ "$REMOTE_SIZE" = "$LOCAL_SIZE" ]; then
              echo "Zip complet et stable cote serveur."
              exit 0
            fi
            sleep 5
          done
          # Non bloquant : la boucle d'extraction ci-dessous reessaie 10 fois.
          echo "::warning::zip distant=$REMOTE_SIZE octets contre $LOCAL_SIZE en local ; l'extraction tentera quand meme."

      - name: Extraction sur le serveur
        run: |
          TOKEN="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          OK=0
          # Fenetre d'environ 200 s : le run 448b162 a echoue en 5 tentatives
          # espacees de 10 s alors que la meme extraction reussissait 20 min
          # plus tard, le zip n'etait pas encore stabilise.
          for i in $(seq 1 10); do
            RESP=$(curl -sk --max-time 300 -X POST \
              -d "token=$TOKEN" \
              https://app.centirio.ma/_deploy_extract.php || true)
            echo "Tentative $i : $RESP"
            if [ "$RESP" = "EXTRACT_OK" ]; then OK=1; break; fi
            sleep 20
          done
          [ "$OK" = "1" ] || exit 1
